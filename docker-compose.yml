version: '3.8'

services:

  backend:
    build: 
      context: ./backend
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes: # <-- Añadido para desarrollo local
      - ./backend:/app
      - /app/node_modules # Excluye node_modules del volumen
    
  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    ports:
      - '5173:5173'
    command: npm run dev
    depends_on:
      - backend
    volumes: # <-- Añadido para desarrollo local
      - ./frontend:/app
      - /app/node_modules # Excluye node_modules del volumen

# (No necesitas volumes si no montas mongo localmente.)